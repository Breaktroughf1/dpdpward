[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dpdpward"
version = "0.0.0"
description = "Map personal data in code for India's DPDP Act: data map, ROPA, Rule 6 safeguards evidence and breach clocks (runs the signed dpdpward binary)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Breaktrough" }]
keywords = ["dpdp", "dpdpa", "privacy", "data-protection", "india", "personal-data", "ropa", "compliance", "sarif"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Security",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Breaktroughf1/dpdpward"
Source = "https://github.com/Breaktroughf1/dpdpward"
Issues = "https://github.com/Breaktroughf1/dpdpward/issues"

[project.scripts]
dpdpward = "dpdpward.__main__:main"

[tool.setuptools.package-data]
dpdpward = ["py.typed"]
